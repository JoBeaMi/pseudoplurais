<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pseudoplurais</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f8f9fa;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.intro{align-items:center;justify-content:center;padding:24px}
.intro h1{font-size:24px;font-weight:800;margin-bottom:4px}
.intro .sub{font-size:14px;color:#888;margin-bottom:24px}
.fg{width:100%;max-width:360px;margin-bottom:12px}
.fg label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:3px}
.fg input[type="text"],.fg input[type="date"]{width:100%;padding:11px;font-size:16px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;-webkit-appearance:none}
.fg input[type="text"]:focus,.fg input[type="date"]:focus{outline:none;border-color:#2196F3}
.check-row{display:flex !important;align-items:center !important;padding:10px 0 !important;border-bottom:1px solid #eee !important;margin:0 !important}
.check-row:last-child{border-bottom:none !important}
.check-row input[type="checkbox"],.check-row input[type="radio"]{width:22px !important;height:22px !important;margin:0 10px 0 0 !important;flex-shrink:0;accent-color:#2196F3;display:inline-block !important}
.check-row label{font-size:16px !important;color:#333 !important;cursor:pointer !important;flex:1 !important;font-weight:400 !important;margin:0 !important;display:inline !important}
.btn{width:100%;max-width:360px;padding:15px;font-size:17px;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:transform 0.1s}
.btn:active{transform:scale(0.97)}
.btn-p{background:#2196F3;color:#fff}
.btn-g{background:#4CAF50;color:#fff}
.btn-o{background:#f5f5f5;color:#666;border:1px solid #ddd}
.btn-s{padding:8px 14px;font-size:13px;width:auto;max-width:none}
.btn[disabled]{opacity:0.35}
.pbar{height:4px;background:#e0e0e0}
.pfill{height:100%;transition:width 0.3s,background 0.3s}
.hdr{padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.tc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 24px}
.badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px}
.pname{font-size:44px;font-weight:800;margin-bottom:6px}
.prompt{font-size:15px;color:#888;margin-bottom:28px}
.opts{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.ob{width:100%;padding:14px 20px;font-size:18px;font-weight:500;border:2px solid #e0e0e0;border-radius:12px;background:#fff;cursor:pointer;text-align:center;transition:transform 0.1s}
.ob:active{transform:scale(0.97)}
.ob.tg{font-weight:700}
.ob.om{background:#FFF3E0;border-color:#FFB74D;color:#E65100;font-size:14px;padding:12px}
.ob.ot{background:#fafafa;border-color:#e0e0e0;color:#888;font-size:14px;padding:12px}
.ri{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:#FFEBEE;font-size:11px;color:#D32F2F;font-weight:600}
.rd{width:7px;height:7px;border-radius:50%;background:#D32F2F;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.done{padding:20px}
.dh{text-align:center;margin-bottom:18px}
.dh h2{font-size:20px;font-weight:700}
.dh .sc{font-size:14px;color:#666;margin-top:4px}
.sg{margin-bottom:8px;border-radius:10px;border:1px solid #e8e8e8;overflow:hidden}
.sgh{padding:6px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.si{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;border-top:1px solid #f0f0f0}
.rt{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500}
.rt-t{background:#E8F5E9;color:#2E7D32}
.rt-o{background:#FFF3E0;color:#E65100}
.rt-x{background:#ECEFF1;color:#546E7A}
.da{display:flex;gap:8px;margin-top:14px}
.da .btn{flex:1;font-size:14px}
.dp{margin-top:10px;padding:8px;background:#f0f0f0;border-radius:8px;font-size:10px;color:#888;font-family:monospace;white-space:pre-wrap;word-break:break-all}
.sm{text-align:center;margin-top:8px;font-size:13px;padding:6px;border-radius:8px}
.sm-ok{background:#E8F5E9;color:#2E7D32}
.sm-er{background:#FFEBEE;color:#C62828}
.sm-wt{background:#FFF3E0;color:#E65100}
</style>
</head>

      '<div class="check-row"><input type="checkbox" id="cb7" value="Outra"><label for="cb7">Outra</label></div>'+
    '</div></div>'+
    '<div style="height:16px"></div>'+
    '<button class="btn btn-p" onclick="go()">Iniciar 🎙️</button>'+
    '<div style="height:8px"></div>'+
    '<button class="btn btn-o" onclick="go(1)" style="font-size:14px">Sem gravação</button></div>';
}

let _sex="";
function setSex(v){_sex=v;}

async function go(noR){
  const sexEl=document.querySelector('input[name="sex"]:checked');
  const cbs=document.querySelectorAll("#cbr input[type=checkbox]:checked");
  const reasons=Array.from(cbs).map(c=>c.value).join("; ");
  const now=new Date();
  const sessionId=now.toISOString().replace(/[:T]/g,"-").slice(0,19).replace(/-/g,"").slice(2);
  S.info={th:document.getElementById("ft").value.trim(),ch:document.getElementById("fc").value.trim(),
    dob:document.getElementById("fd").value,sex:sexEl?sexEl.value:"",re:reasons,
    dt:now.toISOString().slice(0,10),tm:now.toLocaleTimeString("pt-PT"),sid:sessionId};
  if(!S.info.ch){alert("Preencha o nome/código da criança");return;}
  if(!noR){
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:true});
      S.rec=new MediaRecorder(st);S.chunks=[];
      S.rec.ondataavailable=e=>{if(e.data.size>0)S.chunks.push(e.data);};
      S.rec.start();S.recording=true;
    }catch(e){if(!confirm("Sem microfone. Continuar?"))return;}
  }
  S.ph="example";render();
}

function rExample(el){
  el.innerHTML='<div class="screen">'+
    (S.recording?'<div class="hdr"><span></span><div class="ri"><div class="rd"></div>REC</div></div>':'')+
    '<div class="tc">'+
      '<div style="font-size:12px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px">Exemplo · Instrução</div>'+
      '<p style="font-size:16px;color:#333;text-align:center;max-width:340px;line-height:1.5;margin-bottom:6px">"Vou dizer-te umas palavras muito engraçadas que inventei!"</p>'+
      '<p style="font-size:14px;color:#666;text-align:center;max-width:340px;line-height:1.5;margin-bottom:14px">"Deves terminar a minha frase da maneira que consideras correta."</p>'+
      (IMG["3"]?'<img src="data:image/jpeg;base64,'+IMG["3"]+'" style="width:100%;max-width:340px;border-radius:8px;margin-bottom:8px">':'')+
      '<p style="font-size:15px;color:#333;text-align:center;max-width:340px;line-height:1.5">"Aqui está um <b>lifo</b>... e aqui dois <b>lifos</b>."</p>'+
      '<p style="font-size:14px;color:#666;text-align:center;max-width:340px;margin-top:14px">Agora vamos a sério!</p>'+
      '<div style="height:16px"></div>'+
      '<button class="btn btn-p" onclick="startTest()" style="max-width:300px">Começar →</button>'+
    '</div></div>';
}

function startTest(){S.ph="test";S.idx=0;S.resp=[];S.undo=[];render();}

function rTest(el){
  const it=ITEMS[S.idx],p=PC[it.p],pr=(S.idx/ITEMS.length)*100;
  let btns=it.o.map((o,i)=>
    '<button class="ob '+o.k+'" style="'+(o.k==="tg"?"border-color:"+p.bd+";color:"+p.bd+";background:"+p.bg:"")+
    '" onclick="ans('+i+')">'+o.l+'</button>').join("");

  el.innerHTML='<div class="screen">'+
    '<div class="pbar"><div class="pfill" style="width:'+pr+'%;background:'+p.bd+'"></div></div>'+
    '<div class="hdr">'+
      '<button class="btn-s btn-o" onclick="undo()" '+(S.undo.length===0?"disabled":"")+'>← Voltar</button>'+
      (S.recording?'<div class="ri"><div class="rd"></div>REC</div>':'')+
      '<span style="font-size:13px;color:#888">'+(S.idx+1)+'/'+ITEMS.length+'</span>'+
    '</div>'+
    '<div class="tc">'+
      '<div class="badge" style="background:'+p.bg+';color:'+p.bd+'">'+p.lb+'</div>'+
      '<div class="pname">'+it.n+'</div>'+
      (IMG[it.s]?'<img src="data:image/jpeg;base64,'+IMG[it.s]+'" style="width:100%;max-width:300px;border-radius:8px;margin:6px 0;opacity:0.85">':'')+
      '<p class="prompt">"Aqui está um <b>'+it.n.toLowerCase()+'</b>... e aqui dois...?"</p>'+
      '<div class="opts">'+btns+'</div>'+
      '<p style="font-size:11px;color:#aaa;margin-top:10px;text-align:center;max-width:320px">Pseudo mal repetida mas terminação certa? Marque o plural que disse.</p>'+
    '</div></div>';
}

function ans(oi){
  const it=ITEMS[S.idx],o=it.o[oi];
  S.undo.push({idx:S.idx,resp:[...S.resp]});
  S.resp.push({id:it.id,n:it.n,p:it.p,c:o.c,l:o.l});
  if(S.idx<ITEMS.length-1){S.idx++;render();}
  else{
    if(S.rec&&S.rec.state==="recording"){
      // Wait for recorder to finish before sending
      S.rec.onstop=()=>{
        S.rec.stream.getTracks().forEach(t=>t.stop());
        S.recording=false;
        S.ph="done";render();
        autoSend();
      };
      S.rec.stop();
    } else {
      S.recording=false;S.ph="done";render();autoSend();
    }
  }
}

function undo(){
  if(!S.undo.length)return;
  const l=S.undo.pop();S.idx=l.idx;S.resp=l.resp;render();
}

function fmtXL(){
  const bp={};S.resp.forEach(r=>{if(!bp[r.p])bp[r.p]=[];bp[r.p].push(r);});
  const sc=r=>(r&&(r.c==="target"||r.c==="p"))?1:0;
  const nr=r=>r?({p:"p",r:"r",a:"a",omit:"o"}[r.c]||"x"):"";
  const g=p=>(bp[p]||[]);
  const h="id_audio\tterapeuta\tcrianca\tdn\tsexo\trazao\tdata\thora\tREG1\tNAS1\tAL1\tIL1\tOL1\tREG2\tNAS2\tAL2\tIL2\tREG3\tOL2\tNAS3\tAL3\tIL3\tOL3\trespnas1\trespnas2\trespnas3";
  const v=[S.info.sid,S.info.th,S.info.ch,S.info.dob,S.info.sex,S.info.re,S.info.dt,S.info.tm,
    sc(g("reg")[0]),sc(g("nas")[0]),sc(g("al")[0]),sc(g("il")[0]),sc(g("ol")[0]),
    sc(g("reg")[1]),sc(g("nas")[1]),sc(g("al")[1]),sc(g("il")[1]),
    sc(g("reg")[2]),sc(g("ol")[1]),sc(g("nas")[2]),sc(g("al")[2]),sc(g("il")[2]),sc(g("ol")[2]),
    nr(g("nas")[0]),nr(g("nas")[1]),nr(g("nas")[2])].join("\t");
  return{h,v};
}

function rDone(el){
  const gp={};S.resp.forEach(r=>{if(!gp[r.p])gp[r.p]=[];gp[r.p].push(r);});
  const tt=S.resp.filter(r=>r.c==="target"||r.c==="p").length;
  let gs=Object.entries(gp).sort((a,b)=>PO[a[0]]-PO[b[0]]).map(([pt,its])=>{
    const p=PC[pt];
    let rows=its.map(it=>{
      const cls=(it.c==="target"||it.c==="p")?"rt-t":it.c==="omit"?"rt-o":"rt-x";
      return'<div class="si"><span style="font-weight:500">'+it.n+'</span><span class="rt '+cls+'">'+it.l+'</span></div>';
    }).join("");
    return'<div class="sg"><div class="sgh" style="background:'+p.bg+';color:'+p.bd+'">'+p.lb+'</div>'+rows+'</div>';
  }).join("");
  const d=fmtXL();
  const ther=(S.info.th||"x").replace(/\s/g,"").slice(0,8);
  const audioName="plural_"+ther+"_"+(S.info.ch||"x").replace(/\s/g,"_")+"_"+S.info.sid+".webm";
  el.innerHTML='<div class="screen done"><div class="dh"><div style="font-size:40px">✅</div><h2>Concluído</h2>'+
    '<p class="sc">'+S.info.ch+' · '+tt+'/15 respostas alvo</p>'+
    '<p style="font-size:11px;color:#aaa;margin-top:6px;font-family:monospace">ID áudio: '+audioName+'</p></div>'+gs+
    '<div class="da"><button class="btn btn-g" onclick="copyD()">📋 Copiar</button>'+
    '<button class="btn btn-o" onclick="saveA()">🎙️ Áudio</button></div>'+
    '<div class="da"><button class="btn btn-p" onclick="reset()">↻ Nova criança</button></div>'+
    '<div id="stA"></div>'+
    '<div class="dp">'+d.h+"\n"+d.v+'</div></div>';
}

function copyD(){
  const d=fmtXL();
  navigator.clipboard.writeText(d.h+"\n"+d.v).then(()=>sMsg("Copiado!","ok")).catch(()=>sMsg("Erro","er"));
}

function saveA(){
  if(!S.chunks.length){sMsg("Sem gravação","er");return;}
  const b=new Blob(S.chunks,{type:"audio/webm"}),u=URL.createObjectURL(b),a=document.createElement("a");
  const ther=(S.info.th||"x").replace(/\s/g,"").slice(0,8);
  const ch=(S.info.ch||"x").replace(/\s/g,"_");
  a.href=u;a.download="plural_"+ther+"_"+ch+"_"+S.info.sid+".webm";
  a.click();URL.revokeObjectURL(u);sMsg("Guardado!","ok");
}

async function autoSend(){
  if(!SHEETS_URL){sMsg("Sheets não configurado","wt");return;}
  
  const d=fmtXL(),vals=d.v.split("\t"),keys=d.h.split("\t"),payload={};
  keys.forEach((k,i)=>payload[k]=vals[i]||"");
  
  // STEP 1: Send data first (small, fast, almost always works)
  sMsg("A enviar dados...","wt");
  let dataOk=false;
  try{
    await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    dataOk=true;
  }catch(e){
    sMsg("Erro ao enviar dados. Use o botão Copiar para guardar manualmente.","er");
    return;
  }
  
  // STEP 2: Send audio separately (if exists)
  if(!S.chunks.length){
    sMsg("✓ Dados enviados (sem áudio)","ok");
    return;
  }
  
  sMsg("✓ Dados enviados. A enviar áudio...","wt");
  
  try{
    const blob=new Blob(S.chunks,{type:"audio/webm"});
    const b64=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result.split(",")[1]);
      r.onerror=rej;
      r.readAsDataURL(blob);
    });
    const ther=(S.info.th||"x").replace(/\s/g,"").slice(0,8);
    const ch=(S.info.ch||"x").replace(/\s/g,"_");
    const audioPayload={
      id_audio:S.info.sid,
      audio_only:true,
      audio_b64:b64,
      audio_filename:"plural_"+ther+"_"+ch+"_"+S.info.sid+".webm"
    };
    
    await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(audioPayload)});
    sMsg("✓ Tudo enviado!","ok");
  }catch(e){
    sMsg("Dados OK, mas áudio falhou. Use o botão Áudio para guardar manualmente.","er");
  }
}

function sMsg(m,t){const a=document.getElementById("stA");if(a)a.innerHTML='<div class="sm sm-'+t+'">'+m+'</div>';}
function reset(){S={ph:"intro",idx:0,resp:[],info:{},rec:null,chunks:[],recording:false,undo:[]};render();}

render();
</script>
